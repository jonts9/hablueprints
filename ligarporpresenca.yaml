blueprint:
  name: Ligar luzes por presença
  description: >-
    Liga uma ou mais luzes/switches ao detectar movimento, mas apenas os
    cujo helper (input_boolean) de "desligada manualmente" estiver OFF.
    Selecione target_entities e manual_helpers na mesma ordem (posição N de
    uma lista corresponde à posição N da outra). Possui dois filtros
    opcionais combinados com E: "sol posto" (do pôr do sol ao nascer do
    sol) e janela de horário (início e fim). Padrão: sol posto + das 12:00
    às 23:00, ou seja, na prática do pôr do sol até 23:00.
  domain: automation
  input:
    motion_sensor:
      name: Sensor de movimento
      description: Sensor(es) que, ao detectarem presença, disparam a checagem.
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - motion
            - occupancy
          multiple: true
    target_entities:
      name: Luzes do ambiente
      description: Luz(es)/switch(es) candidatos a ligar.
      selector:
        entity:
          domain:
            - light
            - switch
          multiple: true
    manual_helpers:
      name: Input booleans de flag
      description: >-
        Helper(s) de "desligada manualmente". Selecione na MESMA ORDEM das
        entidades acima. A entidade só liga se o helper correspondente
        estiver OFF.
      selector:
        entity:
          domain: input_boolean
          multiple: true
    require_sun_down:
      name: Só com o sol posto
      description: >-
        Se ativado, só liga entre o pôr do sol e o nascer do sol
        (cobre a madrugada).
      default: true
      selector:
        boolean: {}
    restrict_time:
      name: Restringir a uma janela de horário
      description: Se ativado, só liga entre o início e o fim definidos abaixo.
      default: true
      selector:
        boolean: {}
    start_time:
      name: Horário de início
      description: >-
        Usado apenas se a janela de horário estiver ativada. Combinado com
        "sol posto", o padrão 12:00 só serve para excluir a madrugada.
      default: "12:00:00"
      selector:
        time: {}
    end_time:
      name: Horário de fim
      description: >-
        Usado apenas se a janela de horário estiver ativada. Pode cruzar a
        meia-noite (ex: início 18:00, fim 02:00).
      default: "23:00:00"
      selector:
        time: {}

mode: single

variables:
  target_entities: !input target_entities
  manual_helpers: !input manual_helpers

triggers:
  - trigger: state
    entity_id: !input motion_sensor
    to: "on"

conditions:
  - condition: state
    entity_id: sun.sun
    state: below_horizon
    enabled: !input require_sun_down
  - condition: time
    after: !input start_time
    before: !input end_time
    enabled: !input restrict_time

actions:
  - repeat:
      for_each: "{{ range(target_entities | count) | list }}"
      sequence:
        - if:
            - condition: template
              value_template: "{{ is_state(manual_helpers[repeat.item], 'off') }}"
          then:
            - action: homeassistant.turn_on
              target:
                entity_id: "{{ target_entities[repeat.item] }}"
              data: {}

blueprint:
  name: Ligar luzes por presença
  description: >-
    Liga uma ou mais luzes/switches ao detectar movimento, mas apenas os
    cujo helper (input_boolean) de "desligada manualmente" estiver OFF.
    Selecione target_entities e manual_helpers na mesma ordem (posição N de
    uma lista corresponde à posição N da outra). Só atua dentro da janela
    de funcionamento configurada (padrão: do pôr do sol até 23:00).
  domain: automation
  input:
    motion_sensor:
      name: Sensor de movimento
      description: Sensor(es) que, ao detectarem presença, disparam a checagem.
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - motion
            - occupancy
          multiple: true
    target_entities:
      name: Luzes do ambiente
      description: Luz(es)/switch(es) candidatos a ligar.
      selector:
        entity:
          domain:
            - light
            - switch
          multiple: true
    manual_helpers:
      name: Input booleans de flag
      description: >-
        Helper(s) de "desligada manualmente". Selecione na MESMA ORDEM das
        entidades acima. A entidade só liga se o helper correspondente
        estiver OFF.
      selector:
        entity:
          domain: input_boolean
          multiple: true
    use_sunset_start:
      name: Iniciar no pôr do sol
      description: >-
        Se ativado, a janela começa no pôr do sol (e o "Horário de início"
        é ignorado). Neste modo o horário de fim deve ser antes da meia-noite.
      default: true
      selector:
        boolean: {}
    start_time:
      name: Horário de início
      description: Usado apenas se "Iniciar no pôr do sol" estiver desativado.
      default: "18:00:00"
      selector:
        time: {}
    end_time:
      name: Horário de fim
      description: >-
        Fim da janela de funcionamento. Com início em horário fixo, pode
        cruzar a meia-noite (ex: início 18:00, fim 02:00).
      default: "23:00:00"
      selector:
        time: {}

mode: single

variables:
  target_entities: !input target_entities
  manual_helpers: !input manual_helpers
  use_sunset_start: !input use_sunset_start

triggers:
  - trigger: state
    entity_id: !input motion_sensor
    to: "on"

conditions:
  - condition: or
    conditions:
      # Modo pôr do sol: sunset -> end_time (até a meia-noite)
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ use_sunset_start }}"
          - condition: sun
            after: sunset
          - condition: time
            before: !input end_time
      # Modo horário fixo: start_time -> end_time (pode cruzar a meia-noite)
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ not use_sunset_start }}"
          - condition: time
            after: !input start_time
            before: !input end_time

actions:
  - repeat:
      for_each: "{{ range(target_entities | count) | list }}"
      sequence:
        - if:
            - condition: template
              value_template: "{{ is_state(manual_helpers[repeat.item], 'off') }}"
          then:
            - action: homeassistant.turn_on
              target:
                entity_id: "{{ target_entities[repeat.item] }}"
              data: {}
